<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .menu-card {
               width: 90%;
            max-width: 400px;
            margin: 5px auto;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 5px 15px #aaa;
        }

        h3 {
            text-align: center;
            margin-bottom: 5px;
            color: #333;
        }

        h5 {
            margin-top: 5px;
            margin-bottom: 5px;
            color: #007bff;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 5px;
            background: #f5f5f5;
            border-radius: 5px;
        }

        .price {
            font-weight: bold;
            color: green;
        }

        @media screen and (max-width: 600px) {

            .menu-card {
                width: 95%;
                padding: 20px;
            }

            li {
                font-size: 14px;
            }

        }

    </style>
</head>

<body>

    <div class="menu-card">

        <h3 align="center">🍴 Restaurant Menu</h3>

        <h5>Starters</h5>

        <ul>
            <li>
                <span>French Fries</span>
                <span class="price">₹80</span>
            </li>

            <li>
                <span>Veg Spring Roll</span>
                <span class="price">₹120</span>
            </li>

            <li>
                <span>Paneer Tikka</span>
                <span class="price">₹180</span>
            </li>
        </ul>

        <h5>Main Course</h5>

        <ul>
            <li>
                <span>Veg Biryani</span>
                <span class="price">₹200</span>
            </li>

            <li>
                <span>Paneer Butter Masala</span>
                <span class="price">₹220</span>
            </li>

            <li>
                <span>Dal Tadka</span>
                <span class="price">₹150</span>
            </li>
        </ul>

        <h5>Drinks</h5>

        <ul>
            <li>
                <span>Cold Drink</span>
                <span class="price">₹50</span>
            </li>

            <li>
                <span>Fresh Lime</span>
                <span class="price">₹60</span>
            </li>
        </ul>

    </div>

</body>
</html>
