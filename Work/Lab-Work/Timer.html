<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 50px;
        }

        #timer {
            font-size: 40px;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            background-color: blue;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
     <h2>Timer Task</h2>

    <div id="timer">00:00</div>

   <!-- <button onclick="startTimer()">Start</button> -->  
        <button onclick="stopTimer()">Stop</button>
    <button onclick="resetTimer()">Reset</button>

    <script>

        let seconds = 0;
        let timer; 

        window.onload = function() {
                startTimer();
           };

        function startTimer() {

            timer = setInterval(function() {

                seconds++;

                let min = Math.floor(seconds / 60);
                let sec = seconds % 60;

                if (min < 10) {
                    min = "0" + min;
                }

                if (sec < 10) {
                    sec = "0" + sec;
                }

                document.getElementById("timer").innerHTML =
                    min + ":" + sec;

            }, 1000);
        }

        function stopTimer() {
            clearInterval(timer);
        }

        function resetTimer() {

            clearInterval(timer);

            seconds = 0;
            startTimer();

            document.getElementById("timer").innerHTML = "00:00";

             
        }

    </script>

</body>
</html>
