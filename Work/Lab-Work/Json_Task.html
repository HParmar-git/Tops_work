<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  body {
            font-family: Arial;
            background-color: #f2f2f2;
        }
        
table {
 
      width: 80%;
      margin: 30px auto;

       border: 2px solid black;
       border-radius: 2%;

       border-collapse: collapse;   

} 
 th{

    background-color: lightgray;
    padding:  12px; 

 } 
 td {
border: 2px solid black;

            padding: 10px;
            text-align: center;

 }


    </style>

</head>
<body>
     
     <h2 align="center"> *** User Information ***  </h2>
     <table>


        <thead>
           <tr> 
            <th>ID</th>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
                  <th>Phone</th>
                <th>City</th>
           </tr>
         
        </thead> 

         <tbody id ="userData" align="center"></tbody>
     </table>


    <script> 
            fetch('https://jsonplaceholder.typicode.com/users')
            .then((res)=>res.json())
            .then((obj)=> 
            {
                 //  console.log(obj);
                  for(let data of obj)
                  {
                    /* document.write(`ID : ${data.id} <br>
                      NAME : ${data.name} <br><br> <br>`);*/

                      document.getElementById("userData").innerHTML += `
                      <tr> 
                         <td>${data.id}</td>
                          <td>${data.name}</td>
                          <td>${data.username}</td>
                         <td>${data.email}</td>
                          <td>${data.phone}</td>
                          <td>${data.address.city}</td>
                        </tr>
                      
                      `;

                   }

             } )
              .catch((error) => {

            console.log("Error:", error);

        });


        </Script>
</body>
</html>
