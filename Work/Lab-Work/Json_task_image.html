<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            margin: 30px;
        }

        .container {
            width: 90%;
            margin: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            width: 250px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 2px 8px gray;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #555;
        }
    </style>
</head>

<body>

    <h1>Photo Gallery</h1>

    <div class="container" id="photoContainer">
        <!-- Cards will come here -->
    </div>

    <script>

        fetch("https://jsonplaceholder.typicode.com/photos")
            .then((res) => res.json())
            .then((data) => {

                // Show only first 20 photos
                data.slice(0, 20).forEach((photo) => {

                    document.getElementById("photoContainer").innerHTML += `

                        <div class="card">

                            <img src="${photo.url}" 
                                 alt="${photo.title}">

                            <div class="card-content">

                                <h3>ID : ${photo.id}</h3>

                                <p>${photo.title}</p>

                            </div>

                        </div>

                    `;

                });

            })
            .catch((error) => {
                console.log("Error:", error);
            });

    </script>

</body>

</html>
