<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0px;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
        }

        .col-1 { width: 8.33%; }
        .col-2 { width: 16.66%; }
        .col-3 { width: 25%; }
        .col-4 { width: 33.33%; }
        .col-5 { width: 41.66%; }
        .col-6 { width: 50%; }
        .col-7 { width: 58.33%; }
        .col-8 { width: 66.66%; }
        .col-9 { width: 75%; }
        .col-10 { width: 83.33%; }
        .col-11 { width: 91.66%; }
        .col-12 { width: 100%; }


        .navbar {
            background-color: blue;
            padding: 20px;
            color: white;
        }

        .title {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }


        /* TABLE CSS */

        .student-table {
            width: 70%;
            margin: auto;
            border-collapse: separate;
			 border: 2px solid black;
			border-spacing: 3px 3px;
             border-style: double;
		     table-layout: fixed;
        }

        .student-table th,
        .student-table td {
            border: 2px solid ;
			
            padding: 12px;
            text-align: center;
        }

        .student-table th {
            font-weight: bold;
            font-size: 18px;
        }

        .student-table thead th {
            background-color: #f5f5f5;
        }

        .student-table tbody td {
            height: 55px;
        }

    </style>
</head>

<body>

    <h1 class="title">Student Details</h1>

    <table class="student-table">
   <thead>
        <!-- Column Width -->
        <colgroup>
           <col style="width: 15%;">
    <col style="width: 10%;">
    <col style="width: 25%;">
    <col style="width: 25%;">
    <col style="width: 25%;">
        </colgroup>

       

            <!-- First Header Row -->
            <tr>

                <!-- Student List occupies 2 header rows + 4 data rows -->
                <th rowspan="6">
                    Student List
                </th>

                <!-- Students = Id + Name -->
                <th colspan="1">
                    Students
                </th>

                <!-- Details = Department + Roll Number -->
                <th colspan="3">
                    Details
                </th>

            </tr>

            <!-- Second Header Row -->
            <tr>
			
                <th>Id</th>
                <th>Name</th>
                <th>Department</th>
                <th>Roll Number</th>
            </tr>

        </thead>


           
            <tr>
	
                <td>1</td>
                <td>Victor</td>
                <td>Computer Science</td>
                <td>12345</td>
				
            </tr>

            <tr>
			
                <td>2</td>
                <td>Williams</td>
                <td>Electronics</td>
                <td>23456</td>
				</tr>

            <tr>
			
                <td>3</td>
                <td>Harry</td>
                <td>Electrical</td>
                <td>34567</td>
				
            </tr>

            <tr>
		
                <td>4</td>
                <td>Rick</td>
                <td>Civil</td>
                <td>45678</td>
				
            </tr>

    

    </table>

</body>
</html>
