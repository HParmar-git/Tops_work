<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comments API</title>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        /* Table container */
        .table-container {
            width: 100%;
            overflow-x: auto;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        tr:hover {
            background-color: #f4e8ff;
        }

        .loading {
            text-align: center;
            font-size: 20px;
            color: blue;
            margin: 20px;
        }

        .error {
            text-align: center;
            color: red;
            font-size: 18px;
            margin: 20px;
        }

        /* Responsive */
        @media screen and (max-width: 768px) {

            .container {
                width: 67%;
            }

            th,
            td {
                padding: 8px;
                font-size: 2px;
            }

            .title {
                font-size: 12px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <h1 class="title">Comments List</h1>

        <div id="loading" class="loading">
            Loading comments...
        </div>

        <div class="table-container">

            <table id="commentTable">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Post ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Comment</th>
                    </tr>
                </thead>

                <tbody id="commentBody">
                </tbody>

            </table>

        </div>

        <div id="error" class="error"></div>

    </div>


    <script>

        // API URL
        let apiURL = "https://jsonplaceholder.typicode.com/comments";


        // Axios GET request
        axios.get(apiURL)

            .then(function(response) {

                // API response data
                let comments = response.data;

                let output = "";

                // Loop through comments
                comments.forEach(function(comment) {

                    output += `
                        <tr>
                            <td>${comment.id}</td>

                            <td>${comment.postId}</td>

                            <td>${comment.name}</td>

                            <td>${comment.email}</td>

                            <td>${comment.body}</td>
                        </tr>
                    `;

                });


                // Display data in table
                document.getElementById("commentBody").innerHTML = output;


                // Hide loading
                document.getElementById("loading").style.display = "none";

            })

            .catch(function(error) {

                console.log(error);

                document.getElementById("loading").style.display = "none";

                document.getElementById("error").innerHTML =
                    "Unable to load comments. Please try again.";

            });

    </script>

</body>

</html>
